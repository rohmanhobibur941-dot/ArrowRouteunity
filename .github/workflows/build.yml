name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      admob:
        description: 'Also add the AdMob plugin to this build (AdMob first, then Unity Ads)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Android APK (debug keystore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the Unity Android image is big; free some space on the runner first
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Add the AdMob plugin (optional)
        if: ${{ github.event.inputs.admob == 'true' }}
        run: python3 .github/scripts/enable_admob.py

      # Library cache = much faster builds after the first one
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: ArrowRoute.EditorTools.BuildScript.BuildAndroid
          buildName: ArrowRoute
          androidExportType: androidPackage
          androidVersionCode: ${{ github.run_number }}
          versioning: None
          customParameters: -buildTarget Android

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowRoute-apk
          path: build/Android/*.apk
          if-no-files-found: error
